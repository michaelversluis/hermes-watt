name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node demo/build.mjs
  hermes-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: git clone --depth 1 --branch v0.23.0 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-validation
      - run: python scripts/stage.py /tmp/hermes-watt-package
      - name: Official catalog validator
        env:
          PYTHONPATH: /tmp/hermes-validation
        run: python scripts/validate.py /tmp/hermes-watt-package
